<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ cfg.CHATBOT_TITLE }}</title>
<link href="https://fonts.googleapis.com/css2?family={{ cfg.THEME.font.replace(' ', '+') }}:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:{{ cfg.THEME.bg }}; --panel:{{ cfg.THEME.panel }}; --card:{{ cfg.THEME.card }};
  --text:{{ cfg.THEME.text }}; --muted:{{ cfg.THEME.muted }};
  --a1:{{ cfg.THEME.a1 }}; --a2:{{ cfg.THEME.a2 }}; --r:{{ cfg.THEME.r }};
  --head:'{{ cfg.THEME.font }}', 'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(600px 400px at 85% 0%,color-mix(in srgb,var(--a1) 22%,transparent),transparent),
             radial-gradient(500px 400px at 0% 100%,color-mix(in srgb,var(--a2) 20%,transparent),transparent)}
.app{position:relative;height:100%;display:grid;gap:14px;padding:14px}
.layout-left .app{grid-template-columns:290px 1fr}
.layout-right .app{grid-template-columns:1fr 290px}
.layout-right .side{order:2}
.layout-top .app{grid-template-rows:auto 1fr}
.side{background:var(--panel);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;overflow:auto;
  border:1px solid color-mix(in srgb,var(--a1) 25%,transparent)}
.logo{width:56px;height:56px;border-radius:var(--r);display:grid;place-items:center;font-size:26px;font-weight:700;color:#111;
  background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 24px color-mix(in srgb,var(--a1) 40%,transparent)}
h1{font-family:var(--head);font-size:1.45rem;line-height:1.2}
.tag{color:var(--muted);font-size:.9rem}
.side h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);color:var(--text);border:1px solid color-mix(in srgb,var(--a2) 35%,transparent);
  padding:8px 12px;border-radius:999px;font-size:.82rem;cursor:pointer;transition:.2s;font-family:inherit}
.chip:hover{background:var(--a1);color:#111;transform:translateY(-2px)}
.note{margin-top:auto;font-size:.75rem;color:var(--muted);border-top:1px dashed var(--muted);padding-top:12px}
.layout-top .side{flex-direction:row;align-items:center;flex-wrap:wrap;padding:14px 20px}
.layout-top .side .grp{display:flex;gap:14px;align-items:center}
.layout-top .side h3,.layout-top .note{display:none}
.chat{background:var(--panel);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden;min-height:0;
  border:1px solid color-mix(in srgb,var(--a2) 25%,transparent)}
.bar{padding:14px 20px;display:flex;align-items:center;gap:10px;background:var(--card);font-family:var(--head);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--a1);box-shadow:0 0 0 0 var(--a1);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}}
.clear{margin-left:auto;background:none;border:1px solid var(--muted);color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.75rem}
.clear:hover{color:var(--a1);border-color:var(--a1)}
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.m{max-width:82%;padding:12px 16px;line-height:1.55;font-size:.95rem;word-wrap:break-word;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m.bot{background:var(--card);align-self:flex-start;border-radius:4px var(--r) var(--r) var(--r)}
.m.user{background:linear-gradient(135deg,var(--a1),var(--a2));color:#111;align-self:flex-end;border-radius:var(--r) var(--r) 4px var(--r);font-weight:500}
.m code{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:4px;font-family:monospace;font-size:.85em}
.m pre{background:rgba(0,0,0,.4);padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0}
.m ul{margin:6px 0 6px 20px}
.typing span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:var(--a1);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-6px);opacity:.4}}
.input{display:flex;gap:10px;padding:14px;background:var(--card)}
textarea{flex:1;resize:none;height:48px;max-height:120px;border:1px solid transparent;outline:none;border-radius:var(--r);
  background:var(--bg);color:var(--text);padding:13px 16px;font:inherit}
textarea:focus{border-color:var(--a1)}
#send{border:0;border-radius:var(--r);padding:0 22px;font-weight:700;cursor:pointer;color:#111;background:linear-gradient(135deg,var(--a1),var(--a2));transition:.2s}
#send:hover{transform:scale(1.05)}#send:disabled{opacity:.5}
@media(max-width:800px){
  body{overflow:auto}.app{height:auto;min-height:100%;display:flex;flex-direction:column}
  .side{order:0!important}.chat{height:75vh}.m{max-width:92%}
}
</style>
</head>
<body class="layout-{{ cfg.THEME.layout }}">
<div class="app">
  <aside class="side">
    <div class="grp">
      <div class="logo">{{ cfg.THEME.icon }}</div>
      <div><h1>{{ cfg.CHATBOT_TITLE }}</h1><p class="tag">{{ cfg.TAGLINE }}</p></div>
    </div>
    <h3>Quick topics</h3>
    <div class="chips">
      {% for t in cfg.TOPICS %}<button class="chip" data-q="Explain the basics of {{ t }} for exam preparation.">{{ t }}</button>{% endfor %}
    </div>
    <p class="note">Study-only assistant. Off-topic questions will not be answered.</p>
  </aside>
  <main class="chat">
    <div class="bar"><span class="dot"></span><span>{{ cfg.CHATBOT_TITLE }}</span><button class="clear" id="clear">New chat</button></div>
    <div id="msgs"></div>
    <div class="input">
      <textarea id="box" placeholder="Ask a study question..." rows="1"></textarea>
      <button id="send">Send ➤</button>
    </div>
  </main>
</div>
<script>
var msgs=document.getElementById('msgs'),box=document.getElementById('box'),send=document.getElementById('send');
var history=[],busy=false;
var WELCOME="Hi! I'm your {{ cfg.CHATBOT_TITLE }}. Ask me anything about your studies or exam preparation, or tap a topic to begin.";

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){
  s=esc(s);
  s=s.replace(/```([\s\S]*?)```/g,function(_,c){return '<pre>'+c.trim()+'</pre>';});
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|\n)[\*\-] (.+)/g,'$1<li>$2</li>').replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  return s.replace(/\n/g,'<br>').replace(/<br>(<\/?(ul|li|pre))/g,'$1');
}
function add(role,text,html){
  var d=document.createElement('div');d.className='m '+role;
  d.innerHTML=html||(role==='bot'?md(text):esc(text));
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d;
}
async function ask(text){
  text=text.trim();if(!text||busy)return;
  busy=true;send.disabled=true;box.value='';
  add('user',text);
  var t=add('bot','','<div class="typing"><span></span><span></span><span></span></div>');
  try{
    var r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history})});
    var j=await r.json();
    t.innerHTML=md(j.reply);
    history.push({role:'user',text:text},{role:'model',text:j.reply});
  }catch(e){t.textContent='Network error. Please try again.';}
  busy=false;send.disabled=false;msgs.scrollTop=msgs.scrollHeight;box.focus();
}
send.onclick=function(){ask(box.value)};
box.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(box.value);}});
document.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){ask(c.dataset.q)}});
document.getElementById('clear').onclick=function(){history=[];msgs.innerHTML='';add('bot',WELCOME);};
add('bot',WELCOME);
</script>
</body>
</html>
